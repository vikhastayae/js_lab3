<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доска публикаций</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="page">
        <header class="page-header">
            <h1>Доска публикаций</h1>
        </header>

        <section class="panel">
            <div class="section-heading">
                <h2 id="posts-heading">Публикации</h2>
                <button class="button button-load" id="load-button" type="button">Загрузить публикации</button>
            </div>
            <div id="posts-list" class="posts-list">
                <p class="empty-state">Нажмите кнопку, чтобы загрузить публикации.</p>
            </div>
        </section>

        <section class="panel">
            <h2 id="form-heading">Новая публикация</h2>
            <form id="post-form" novalidate>
                <label for="title">Заголовок</label>
                <input id="title" name="title" type="text" placeholder="Введите заголовок">

                <label for="body">Текст</label>
                <textarea id="body" name="body" rows="5" placeholder="Введите текст публикации"></textarea>

                <button class="button button-create" id="create-button" type="submit">Создать публикацию</button>
            </form>
        </section>

        <section class="panel messages-panel">
            <h2 id="messages-heading">Сообщения</h2>
            <div id="messages" class="messages" role="status" aria-live="polite">Здесь появится результат загрузки или отправки.</div>
        </section>
    </main>
</body>
</html>
